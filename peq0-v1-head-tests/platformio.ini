; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds firmware only. The native env exists purely to host the
; impact-detector tests (`pio test -e native`) and has no sources of its own,
; so including it in the default build just fails with "nothing to build".
[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c6
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/gen_head_mock.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wl,-u,_printf_float
    ; Demo/bring-up: lets the mock CSV's spliced impacts reach the detector and
    ; enables the "impact-test" control write. NEVER ship this enabled — with it
    ; on, fabricated rows are indistinguishable from a real athlete's hits.
    -DIMPACT_TEST_HOOK
    ; -I lib/dw3000/dwt_uwb_driver
    ; -I lib/dw3000/dwt_uwb_driver/dw3000
    ; -I lib/dw3000/dwt_uwb_driver/dw3720
    ; -I lib/dw3000/dwt_uwb_driver/lib/qmath/include
    ; -I lib/dw3000/port


lib_deps =
    ; file://lib/dw3000

test_framework = unity
test_speed = 115200
test_filter = test_dwm3000, test_lsm6dsv

; Host-run tests for logic that has no business needing a board. The impact
; detector is pure state-machine code over (sample, time): its properties —
; one record per hit, the peak rather than the first crossing, the refractory
; window, the backlog when nothing is listening — are the ones that are
; genuinely hard to verify by hitting a helmet, so they run here instead.
;
; The ESP-IDF headers it touches are shimmed in test/support (including a
; controllable clock), and the transports are stubbed in the test itself.
[env:native]
platform = native
test_framework = unity
test_filter = test_impact_det
build_flags =
    -std=c++17
    -I components/peripherals
    -I test/support
build_src_filter = -<*>
